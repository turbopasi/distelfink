[package]
name = "distelfink"
version = "0.9.1"
description = "Desktop-Schreibsoftware für Autoren"
authors = ["Pascal Lamers"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "distelfink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# MSVC druckt beim cdylib-Link eine Info-Meldung (.dll.lib/.dll.exp) auf stdout,
# die rustc sonst als Warnung meldet.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Selbst-Update über GitHub Releases (signiertes latest.json).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# Ebene C (interne Versionierung): kein Netzwerk nötig, daher ohne https/ssh.
git2 = { version = "0.20", default-features = false }
# Phase 6 (Export/Compile): Markdown-Parsing + Zielformate DOCX/PDF/ePub.
pulldown-cmark = { version = "0.13", default-features = false }
docx-rs = "0.4"
epub-builder = "0.8"
genpdf = "0.2"
