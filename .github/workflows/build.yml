name: Build

# Reine Text-Änderungen lösen keinen vollen Release-Build auf zwei Runnern aus.
# Sobald ein Commit auch nur eine andere Datei anfasst — insbesondere
# package-lock.json oder Cargo.lock — läuft der Workflow samt Notices-Prüfung
# wie gehabt.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "docs/**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
          - platform: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Hook-Abhängigkeiten und TypeScript-Regeln (eslint.config.js).
      - name: Lint
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run lint

      # Vor dem teuren Build: vitest (Editor-Roundtrips, Fluss, Speichern,
      # Mindboard-Modell, Store).
      - name: Frontend tests
        run: npm test

      # Formatierung ist einheitlich (rustfmt) und soll es bleiben.
      - name: Rust formatting
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check

      # clippy ist sauber und soll es bleiben.
      - name: Rust lints
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Einmal reicht — die Rust-Logik ist plattformunabhängig, und jeder
      # Testlauf kompiliert das Backend ein zweites Mal (Debug-Profil).
      - name: Rust tests
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo test

      # Die Schlüssel sind nötig, weil `createUpdaterArtifacts` aktiv ist: Tauri
      # bricht ab, wenn ein öffentlicher Schlüssel konfiguriert ist, aber kein
      # privater zum Signieren bereitsteht.
      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Läuft erst nach dem Build, weil der Generator die Lizenztexte aus der
      # entpackten Cargo-Registry liest. Schlägt fehl, sobald eine Abhängigkeit
      # dazugekommen ist, ohne dass THIRD-PARTY-NOTICES.md erneuert wurde.
      - name: Check third-party notices are up to date
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          npm run notices
          git diff --exit-code -- THIRD-PARTY-NOTICES.md \
            || { echo "::error::THIRD-PARTY-NOTICES.md ist veraltet — 'npm run notices' ausführen und committen."; exit 1; }

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # Bekannte Sicherheitslücken in Abhängigkeiten. Ein eigener Job: eine neue
  # Meldung soll sichtbar werden, aber nicht spontan einen Release blockieren.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: npm audit
        run: npm audit --omit=dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
